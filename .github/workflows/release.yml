name: release

# Push a tag (or start a run from the Actions tab) and GitHub builds one universal
# macOS bundle, runs the Rust tests, signs and notarizes it when the Apple secrets
# are configured, signs the updater archive, and publishes the release with
# `latest.json`, which the in-app updater reads.
#
# Repository configuration:
#   variables  TAURI_SIGNING_PUBLIC_KEY            public half of `pnpm tauri signer generate`
#   secrets    TAURI_SIGNING_PRIVATE_KEY           private half (never committed)
#              TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   optional   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#              APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY,
#              APPLE_API_KEY_P8 (contents of AuthKey_<id>.p8; written to
#              APPLE_API_KEY_PATH for notarytool)
on:
 workflow_dispatch:
  inputs:
   draft:
    description: Publish the release as a draft instead
    type: boolean
    default: false
 push:
  tags:
   - "app-v*"

concurrency:
 group: release-${{ github.ref }}
 cancel-in-progress: false

jobs:
 # A tag only builds after the same checks a pull request must pass.
 verify:
  name: verify
  uses: ./.github/workflows/verify.yml

 build-macos:
  name: grove universal-apple-darwin
  needs: verify
  runs-on: macos-latest
  permissions:
   contents: write
  steps:
   - uses: actions/checkout@v7

   - name: install pnpm
     uses: pnpm/action-setup@v6

   - name: setup node
     uses: actions/setup-node@v7
     with:
      node-version: lts/*
      cache: pnpm

   - name: install Rust
     uses: dtolnay/rust-toolchain@stable
     with:
      targets: aarch64-apple-darwin,x86_64-apple-darwin

   - name: Rust cache
     uses: Swatinem/rust-cache@v2
     with:
      workspaces: "./src-tauri -> target"

   - name: install frontend dependencies
     run: pnpm install --frozen-lockfile

   - name: test the read paths
     run: cargo test --manifest-path src-tauri/Cargo.toml

   # The release tag and the asset names both follow the app version, so it is read
   # from the bundled config rather than from `github.ref` (which is a branch on a
   # manual run).
   - name: read the app version
     id: app
     run: |
      version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
      echo "version=$version" >> "$GITHUB_OUTPUT"
      echo "tag=app-v$version" >> "$GITHUB_OUTPUT"

   # The updater refuses unsigned archives, so a release without the key pair
   # fails here rather than shipping an update nobody can install. The public key
   # goes into a config overlay (`tauri build --config`) and, through the job
   # environment, into the binary. Apple signing is exported only when its secrets
   # exist: an empty APPLE_CERTIFICATE would make the bundler try to import it.
   - name: prepare signing
     env:
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
     run: |
      if [ -z "$TAURI_SIGNING_PUBLIC_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
        echo "::error::set the TAURI_SIGNING_PUBLIC_KEY variable and TAURI_SIGNING_PRIVATE_KEY secret (pnpm tauri signer generate)"
        exit 1
      fi
      echo "TAURI_SIGNING_PUBLIC_KEY=$TAURI_SIGNING_PUBLIC_KEY" >> "$GITHUB_ENV"
      node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({plugins: {updater: {pubkey: process.env.TAURI_SIGNING_PUBLIC_KEY}}}))' \
        "$RUNNER_TEMP/tauri.release.conf.json"
      if [ -n "$APPLE_CERTIFICATE" ]; then
        for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
          echo "$name=${!name}" >> "$GITHUB_ENV"
        done
      fi
      if [ -n "$APPLE_API_KEY_P8" ]; then
        key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
        printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
        echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
        echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
        echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      fi

   - name: build the bundle and publish the release
     uses: tauri-apps/tauri-action@v1
     env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
     with:
      tagName: ${{ steps.app.outputs.tag }}
      releaseName: "Grove v__VERSION__"
      releaseBody: |
       Read-only viewer of git working-tree changes across the repositories you
       register. It never stages, commits, pushes, pulls, or edits files.

       ### The assistant

       Press ⌘L for a chat that explains a project's changes from Grove's own facts. It
       is not a coding agent: its entire capability is nine read-only tools (status,
       change lists, diffs, file contents, a search across changed files, worktrees,
       recent commits, file history, blame), each path-guarded to a registered project,
       so it cannot write and cannot read outside them. Answers cite `path:line`, and
       the source list comes from the tools it actually called.

       Point it at an OpenAI-compatible endpoint (OpenAI, DeepSeek, Groq, OpenRouter, or
       a local Ollama, LM Studio, or llama.cpp server) or Anthropic, with a model and a
       key. A remote host needs an explicit acknowledgement before the first turn, and
       nothing is transmitted until you send a message. Keys go to the macOS Keychain.

       ### The CLI and MCP server

       The app binary is also a read-only CLI, so scripts and agents see exactly what the
       window shows, and `grove mcp` serves the assistant's nine tools to Claude Code or
       any MCP client over stdio:

       ```bash
       grove status [--json]
       grove changes [<project>] [--json]
       grove diff <project> <file> [--view head|staged|unstaged] [--json]
       grove worktrees [<project>] [--json]
       grove ask "what changed here?" [--project <path>]
       claude mcp add grove -- /Applications/Grove.app/Contents/MacOS/grove mcp
       ```

       ### Install

       1. Download `Grove___VERSION___universal.dmg` (Apple silicon and Intel) and open it.
       2. Drag **Grove** to Applications.

       Later versions install from **Grove → Check for Updates…**; the update is
       verified against the signing key before it is applied.

       `Grove___VERSION___universal.app.zip` is the same bundle zipped, if you would
       rather not mount a disk image.
      releaseDraft: ${{ inputs.draft || false }}
      prerelease: false
      includeUpdaterJson: true
      args: --target universal-apple-darwin --config ${{ runner.temp }}/tauri.release.conf.json

   # tauri-action attaches the .dmg, the signed updater archive (.app.tar.gz + .sig),
   # and latest.json. The zipped app and the screenshot are added here so the
   # release matches what a local build ships.
   - name: attach the zipped app
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: |
      app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Grove.app"
      zip="/tmp/Grove_${{ steps.app.outputs.version }}_universal.app.zip"
      ditto -c -k --keepParent "$app" "$zip"
      gh release upload "${{ steps.app.outputs.tag }}" "$zip" --clobber

   - name: attach the screenshot
     env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     run: gh release upload "${{ steps.app.outputs.tag }}" docs/grove-screenshot.png --clobber

   - name: upload the bundle as run artifacts
     uses: actions/upload-artifact@v7
     with:
      name: grove-universal-apple-darwin
      path: |
       src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
       src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
       src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
       src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
      if-no-files-found: error
