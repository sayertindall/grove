[package]
name = "grove"
version = "0.2.1"
description = "Read-only viewer of git working-tree changes across registered repositories"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
git2 = "0.21"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-window-state = "2"
# Chat: an HTTP client that can stream SSE, content hashing for document identity,
# the macOS Keychain for provider keys, and the app-data directory without an
# AppHandle so the CLI subcommands can read the store outside a Tauri process.
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time"] }
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native"] }
dirs = "6"

[dev-dependencies]
# Enables tauri::test::mock_app for the watcher smoke test.
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
