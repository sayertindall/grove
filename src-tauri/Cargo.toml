[package]
name = "grove"
version = "0.2.1"
description = "Read-only viewer of git working-tree changes across registered repositories"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the menu-bar tray that lists dirty projects.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
git2 = "0.21"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-window-state = "2"
# Chat: an HTTP client that can stream SSE, content hashing for document identity,
# the macOS Keychain for provider keys, and the app-data directory without an
# AppHandle so the CLI subcommands can read the store outside a Tauri process.
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `rt` adds `JoinSet`, which bounds the parallel project reads of `list_projects`.
tokio = { version = "1", features = ["rt", "sync", "time"] }
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native"] }
dirs = "6"
# Typed errors: `GroveError` derives Display/Error so the command boundary can send
# `{ code, message, path }` and the CLI can pick exit codes by variant, not by text.
thiserror = "2"
# Distribution, all official Tauri plugins. single-instance (with its `deep-link`
# feature) forwards a second launch — and the `grove://` URL it carries on
# Windows/Linux — to the running app; deep-link registers the `grove` scheme;
# global-shortcut toggles the window from anywhere; updater checks and installs
# signed releases, only when the user asks.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Decodes the path segments of a `grove://` URL; already in the tree through url.
percent-encoding = "2"
# `grove mcp`: the official MCP Rust SDK serves the chat's read-only tools over
# stdio to external agents (Claude Code, Codex) without an HTTP listener.
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
# Triage: the credential patterns scanned over added lines; already in the tree.
regex = "1"

# The debug-only automation bridge renders the hidden webview with WebKit's
# `takeSnapshotWithConfiguration` (an Objective-C block callback) and reads app
# presence; objc2 and block2 are already in the tree through tauri/wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[dev-dependencies]
# Enables tauri::test::mock_app for the watcher smoke test.
tauri = { version = "2", features = ["test"] }
# The menu accelerators are parsed with the exact parser tauri's menus use,
# without building a native menu off the main thread in a test.
muda = { version = "0.19", default-features = false }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
